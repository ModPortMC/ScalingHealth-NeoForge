import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
    id 'eclipse'
}

base {
    archivesName = project.archivesBaseName
}

ext {
    VERSION_INFO = getModVersion()
    VERSION_SHORT = "${VERSION_INFO['version_short']}"
}

version = "${VERSION_INFO['version']}"

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
println('NeoForge: ' + project.neo_version + ' Minecraft: ' + project.minecraft_version)

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

repositories {
    maven {
        name = 'CurseMaven'
        url = uri('https://cursemaven.com')
        content {
            includeGroup 'curse.maven'
        }
    }
    mavenLocal()
    mavenCentral()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            jvmArguments.add('-Xmx6G')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').getAbsolutePath(), '--existing',
                    file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// ModDevGradle 2.x exposes the configured server as runServer. The host
// verification command historically invokes runGameTestServer, so keep that
// compatibility name as a lifecycle task backed by the real NeoForge task.
tasks.register('runGameTestServer') {
    group = 'neoforge'
    description = 'Runs the NeoForge server with the configured game-test namespace enabled.'
    dependsOn tasks.named('runServer')
}

configurations {
    // Dependencies in this configuration are unpacked into the final jar.
    extraLibs
    implementation.extendsFrom extraLibs
}

dependencies {
    // EvalEx remains shaded into the mod jar, matching the Forge build.
    extraLibs 'com.udojava:EvalEx:2.1'

    // Keep the selected Silent Lib file external to the mod jar. File 7936002 is
    // Silent Lib 11.2.0 for NeoForge 26.1.x; its file ID is pinned in gradle.properties.
    implementation "curse.maven:silent-lib-242998:${project.silentlib_curse_file_id}"
}

// Generate the final NeoForge descriptor from the locked project properties.
tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.version,
            silentlib_version      : project.silentlib_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveAppendix = project.mc_version
    manifest {
        attributes([
                'Specification-Title'    : project.mod_id,
                'Specification-Vendor'   : 'SilentChaos512',
                'Specification-Version'  : "${VERSION_INFO['version_simple']}",
                'Implementation-Title'   : project.name,
                'Implementation-Version' : "${version}",
                'Implementation-Vendor'  : 'SilentChaos512',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    from {
        configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('deobfJar', Jar) {
    archiveAppendix = project.mc_version
    archiveClassifier = 'deobf'
    from sourceSets.main.output
}

tasks.register('sourcesJar', Jar) {
    archiveAppendix = project.mc_version
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}

tasks.register('javadocJar', Jar) {
    dependsOn tasks.named('javadoc')
    archiveAppendix = project.mc_version
    archiveClassifier = 'javadoc'
    from tasks.named('javadoc').flatMap { it.destinationDirectory }
}

artifacts {
    if (project.hasProperty('doDeobfJar')) {
        archives tasks.named('deobfJar')
    }
    if (project.hasProperty('doSourceJar')) {
        archives tasks.named('sourcesJar')
    }
    if (project.hasProperty('doJavadocJar')) {
        archives tasks.named('javadocJar')
    }
}

tasks.register('zipUserStartPack', Zip) {
    archiveBaseName = 'user_start_pack'
    archiveVersion = '2'
    destinationDirectory = file('build/zips')
    from('user_starter_pack')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// A source ZIP or fork must build without depending on local Git tags.
def getModVersion() {
    def declaredVersion = project.mod_version.toString()
    def parts = declaredVersion.tokenize('.')
    return [
            version_simple: "${parts[0]}.${parts[1]}".toString(),
            version_short: declaredVersion,
            version: "${declaredVersion}+${getBuildNumber()}".toString(),
    ]
}

String getBuildNumber() {
    def versionFile = file('version.properties')
    if (versionFile.canRead()) {
        Properties versionProps = new Properties()
        versionProps.load(new FileInputStream(versionFile))
        return versionProps['build_number'].toString()
    }
    return '1'
}

tasks.register('incrementBuild') {
    doLast {
        def versionFile = file('version.properties')
        if (versionFile.canRead()) {
            Properties versionProps = new Properties()
            versionProps.load(new FileInputStream(versionFile))
            def num = versionProps['build_number'].toInteger() + 1
            println('Incrementing BuildNumber to: ' + num)
            versionProps['build_number'] = num.toString()
            versionProps.store(versionFile.newWriter(), null)
        } else {
            println('version.properties file not found! Ignoring.')
        }
    }
}

def writeUpdateJson() {
    def updateFile = new File('update.json')
    def json = new JsonSlurper().parse(updateFile)

    if (!json[project.mc_version].containsKey(VERSION_SHORT)) {
        json[project.mc_version][VERSION_SHORT] = project.changelogUrl
    }
    json[project.mc_version] = json[project.mc_version].sort([compare: { a, b -> b.compareTo(a) }] as Comparator)
    json['promos']["${project.mc_version}-latest"] = VERSION_SHORT

    updateFile.write(JsonOutput.prettyPrint(JsonOutput.toJson(json)))
}

tasks.register('createUpdateJson') {
    doLast {
        println('Updating update.json...')
        writeUpdateJson()
    }
}
